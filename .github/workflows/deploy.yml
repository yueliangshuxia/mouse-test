# 构建静态产物并发布到 GitHub Pages。
#
# 走的是 Actions 部署(而不是「从分支发布」),原因是本站的产物里有 `_astro/`
# 目录 —— 以**下划线开头**。分支发布那条路 GitHub 会套一层 Jekyll,而 Jekyll
# 默认会**忽略下划线开头的目录**,结果就是所有 CSS/JS 全部 404、页面裸奔。
# Actions 部署不经过 Jekyll,没这个问题(另外还留了个 `public/.nojekyll` 兜底)。
#
# `dist/` 是构建产物、在 .gitignore 里,所以**不入库** —— 每次由 CI 现构建。

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 允许在 Actions 页面手动触发一次
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个部署;新的推上来时取消排队中的旧任务,但不打断正在发布的那次
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 类型检查和单测在 CI 里也跑一遍:构建通过不代表没坏,
      # 而这两种失败在本地是最容易「忘了跑」的
      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm test

      - name: 构建
        run: npm run build

      - uses: actions/configure-pages@v5

      # ⚠️ 上传的是 `dist/client`,**不是 `dist`** —— 这一条是踩出来的。
      #
      # 挂上 `@astrojs/node` 之后,Astro 会把 `settings.buildOutput` 无条件改成
      # `'server'`(判据是 adapter 自己声明的 `adapterFeatures.buildOutput`,与本站
      # 写了几条 SSR 路由、`output` 配成什么**都无关**),于是静态产物不再落在
      # `dist/` 顶层,而是落到 `build.client` —— 实测就是 `dist/client/`,服务端入口
      # 在 `dist/server/entry.mjs`。
      #
      # 上传 `dist` 的话构建**照样成功、CI 照样全绿**,只是 Pages 根目录下多出一个
      # 空的 `client/` 和一个 `server/`,40 个页面集体 404 —— 又是一次「构建通过
      # 不说明没事」。判据是这条路径必须和 `astro.config.mjs` 里 adapter 那一节的
      # 注释对得上,改一处就要改另一处。
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
