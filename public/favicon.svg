<!--
  站点图标:鼠标剪影 + 滚轮孔。

  颜色必须和 global.css 里仪器窗的强调色(well-accent)与轨迹色(trail-color)同值 ——
  那个磷光绿是全站**唯一**有颜色的记号(纸面一律无彩色,"有颜色的地方就是在出数")。
  图标跟着它走,换色时三处一起改。

  (注:上面这两个令牌名在本文件里刻意不写全 —— XML 注释不允许出现连续两个连字符,
  写了会让整个 SVG 解析失败,图标直接不出来。)

  刻意**不做**深色模式分支。这个绿是中明度,实测在白色、浅灰、Chrome 深色标签栏
  (#202124)、近黑四种底色上都能认出来,16px 下滚轮孔也还在。原先那版按
  prefers-color-scheme 切两套色,那是为了让图标里有个深色形状;现在整个标就是绿的,
  再切一套只会多一处会漂的地方。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <path
    fill="#5ed69b"
    fill-rule="evenodd"
    clip-rule="evenodd"
    d="M16 3a8 8 0 0 1 8 8v10a8 8 0 0 1-16 0V11a8 8 0 0 1 8-8ZM15 3h2v6h-2V3ZM14 9h4a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2Z"
  />
</svg>
